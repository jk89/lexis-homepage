services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    ports:
      - "3020:80"
  ssl-proxy:
    image: nginx:alpine
    ports:
      - "4453:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx.dev.ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
